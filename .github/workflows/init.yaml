name: Initialize Template
on:
  push:
jobs:
  update_image_paths:
    name: Update template files
    if: github.repository != 'DRSchlaubi/hsfulda-gitops-demo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete Initialization Workflow
        working-directory: .github/workflows
        run: rm init.yaml
      - name: Set lowercased repository name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> "$GITHUB_ENV"
      - name: Update Helm Chart template
        working-directory: calendar-chart
        run:  yq -i '.image.repository = "ghcr.io/${{ env.REPO_LOWER }}/calendar-app"' values.yaml
      - name: Update ArgoCD project
        working-directory: calendar-argo
        run: |
          yq -i '.spec.source.repoURL = "oci://ghcr.io/${{ env.REPO_LOWER }}/calendar-app-chart"' calendar-app.yaml
          sed -i "s|--repo <your repo>|--repo https://github.com/${{ github.repository }}.git|g" README.md
      - name: Update Flux project
        working-directory: calendar-flux
        run:  |
          yq -i '. | select(.kind == "OCIRepository" and .metadata.name == "calendar-app").spec.url = "oci://ghcr.io/${{ env.REPO_LOWER }}/calendar-app-chart"' calendar-app/calendar-app.yaml
          yq -i '. | select(.kind == "ImageRepository" and .metadata.name == "calendar-app").spec.image = "ghcr.io/${{ env.REPO_LOWER }}/calendar-app"' calendar-app/image-update-automation.yaml
          sed -i "s/<your github user>/${{ github.repository_owner }}/g; s/<your repo>/${{ github.event.repository.name }}/g" README.md
      - name: Update template status
        run: |
          sed -i 's/Template status: unready/Template status: ready/g; s/Template%20status-unready-red/Template%20status-ready-brightgreen/g' README.md
      - name: Commit initialized files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: initialize repository from template"
          git push
      - name: Trigger CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: |
          gh workflow run "docker-ci.yaml" \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
          gh workflow run "helm-chart-ci.yaml" \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}          
